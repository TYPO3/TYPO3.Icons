# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# Tags are left to the release workflow, which runs this build itself
# before it publishes.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

env:
  NODE: 24.x

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE }}"

      - name: Set up cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.NODE }}-${{ hashFiles('package.json') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE }}-${{ hashFiles('package.json') }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Stylelint
        run: npm run stylelint

      - name: Verify sources and metadata
        run: npm run verify

      - name: Build
        run: npm run icons-build

      # The package ships the committed dist folder. A fresh build must
      # reproduce it, so no commit can carry stale or edited files.
      - name: Check build against committed files
        run: git diff --exit-code -- dist
